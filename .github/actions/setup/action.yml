name: Set up workspace
description: Set up Dart SDK, install Melos, and run pub get

runs:
  using: composite
  steps:
    - uses: dart-lang/setup-dart@v1
      with:
        sdk: 3.12.2
        # Composite actions set GITHUB_ACTION_PATH to this folder, so the
        # default matcher looks for dart-analyzer.json here and fails setup.
        problem-matcher: false

    - shell: bash
      run: dart pub global activate melos

    - shell: bash
      run: dart pub get
