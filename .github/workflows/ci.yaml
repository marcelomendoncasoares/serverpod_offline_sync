name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - stable-*
    paths-ignore:
      - '**/*.md'
  pull_request:
    branches:
      - main
      - stable-*
    paths-ignore:
      - '**/*.md'

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  verify_generated:
    name: verify generated code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Melos
        run: dart pub global activate melos

      - name: Run pub get
        run: dart pub get

      - name: Generate code
        run: melos generate

      - name: Verify generated code is committed
        run: git diff --exit-code

  verify_migrations:
    name: verify migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Melos
        run: dart pub global activate melos

      - name: Run pub get
        run: dart pub get

      - name: Create migrations
        run: melos create-migration

      - name: Verify migrations are committed
        run: git diff --exit-code

  dart_format:
    name: dart format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Run pub get
        run: dart pub get

      # Skip code generation for formatting check
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

  dart_analyze:
    name: dart analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Melos
        run: dart pub global activate melos

      - name: Run pub get
        run: dart pub get

      - name: Run lint
        run: melos lint

  tests:
    name: dart test
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Install Melos
        run: dart pub global activate melos

      - name: Run pub get
        run: dart pub get

      - name: Run tests
        run: melos test

      # TODO: Find a way to make coverage work with the tests running from a
      # test project and not as part of the module.
      #
      # - name: Activate coverage package
      #   run: dart install coverage
      #
      # - name: Format coverage
      #   run: dart run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --report-on=lib --check-ignore --ignore-files="**/*.g.dart"
      #
      # - name: Generate coverage report
      #   run: dart scripts/coverage_report.dart --ci > coverage-results.txt
      #
      # - name: Comment on PR
      #   if: github.event_name == 'pull_request'
      #   uses: thollander/actions-comment-pull-request@v3
      #   with:
      #     file-path: coverage-results.txt
      #     comment-tag: coverage-results

  benchmarks:
    name: run benchmarks
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Run pub get
        run: dart pub get

      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"

      - name: Fetch Existing Benchmark Data
        run: git fetch origin refs/notes/benchmarks:refs/notes/benchmarks || true

      - name: Run benchmarks
        working-directory: benchmark
        # --verbosity=error avoids "Running build hooks..." on stdout (pollutes PR comment).
        run: dart run --verbosity=error run.dart --ci > ../benchmark-results.txt

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v3
        with:
          file-path: benchmark-results.txt
          comment-tag: benchmark-results

      - name: Store Benchmark Data in Git Notes
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            COMMIT_SHA=${{ github.event.pull_request.head.sha }}
          else
            COMMIT_SHA=${{ github.sha }}
          fi
          git notes --ref=benchmarks add -f -F benchmark-results.txt $COMMIT_SHA

      - name: Push Benchmark Data
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork != true
        run: git push origin refs/notes/benchmarks

