name: Publish to pub.dev

on:
  workflow_dispatch:
  push:
    tags:
      # Matches tags like `2.9.1` and `3.0.0-alpha.1` or `3.0.0-rc.1`
      - '[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish-serverpod_offline_sync:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/serverpod_offline_sync

  publish-serverpod_offline_sync_client:
    needs: publish-serverpod_offline_sync
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/serverpod_offline_sync_client

  publish-serverpod_offline_sync_server:
    needs: publish-serverpod_offline_sync
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@v1
    with:
      working-directory: packages/serverpod_offline_sync_server
