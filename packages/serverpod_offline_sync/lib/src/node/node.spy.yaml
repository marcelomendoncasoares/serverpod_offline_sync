### CRDT nodes table.
###
### This table stores stable CRDT replica identities that have been seen.
###
### Local nodes are clocks of this database, one per user ([localUserUuid]);
### remote nodes are received through sync.
class: CrdtNode
table: crdt_nodes
database: all
fields:
  ### Stable unique identifier for the replica/database install.
  uuidNodeId: UuidValue, default=random_v7, unique

  ### Local user whose clock this node is. Null for remote nodes.
  localUserUuid: UuidValue?, unique

  ### Last HLC generated by this node's local clock. Null for remote nodes.
  lastHlc: Hlc?
