### CRDT nodes table.
###
### This table stores stable CRDT replica identities that have been seen.
###
### A node is local when this database authored its facts, and remote when they
### were received through sync. Each local user owns one local clock node per
### database ([localUserUuid]). Before clocks were owned per user, one local node
### authored every user's facts; that legacy node keeps its [lastHlc] and its
### facts, but no longer clocks new writes.
class: CrdtNode
table: crdt_nodes
database: all
fields:
  ### Stable unique identifier for the replica/database install.
  uuidNodeId: UuidValue, default=random_v7, unique

  ### Local user whose clock this node is, when this database owns it.
  ###
  ### Null for remote nodes and for the legacy database-wide node.
  localUserUuid: UuidValue?

  ### Last HLC generated by this node's local clock.
  ###
  ### Present only on local nodes, including the legacy one. Remote nodes keep
  ### their progress as per-space checkpoints instead.
  lastHlc: Hlc?

indexes:
  ### One local clock per user in this database.
  crdt_nodes_local_user_idx:
    fields: localUserUuid
    unique: true
