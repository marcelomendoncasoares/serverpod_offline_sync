### CRDT spaces table.
###
### Normalized storage for space IDs. The normalized data table references this
### by integer id instead of storing the space id string.
class: OfflineSyncSpace
table: offline_sync_spaces
database: all
fields:
  ### Space identifier string.
  uuidSpaceId: UuidValue, default=random_v7, unique

  ### Greatest HLC a local clock has written or merged into this space.
  ###
  ### Writes observe it under the space lock, so they follow facts committed by
  ### other users' clocks.
  lastHlc: Hlc?

  ### The nodes associated with the space and their per-space checkpoints.
  nodes: List<OfflineSyncSpaceNode>?, relation(name=space_nodes)
