### A CRDT node's participation and observed clock within one space.
class: OfflineSyncSpaceNode
table: offline_sync_space_nodes
database: all
fields:
  ### Space this participation row belongs to.
  space: OfflineSyncSpace?, relation(name=space_nodes, onDelete=Cascade)

  ### Stable replica identity participating in the space.
  node: CrdtNode?, relation(onDelete=Cascade)

  ### Highest observed author HLC; this does not prove complete delivery.
  lastReceivedHlc: Hlc?

indexes:
  ### Enforces one participation row per (space, node).
  offline_sync_space_node_unique_idx:
    fields: spaceId, nodeId
    unique: true
