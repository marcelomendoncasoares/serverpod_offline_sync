### CRDT field foreign key projection table.
###
### This table stores the materialized foreign key projection for a CRDT field.
### The user/attempted value remains the CRDT field value; this row records the
### currently visible database value when FK repair requires it to differ.
###
### Repairs must be recomputable from merged CRDT row, field, and tombstone
### facts. This table records what was materialized into the domain row; it does
### not decide business semantics or create user field updates during merge.
class: CrdtDataForeignKey
table: crdt_data_foreign_key
database: all
fields:
  ### The field that the foreign key belongs to.
  field: CrdtDataField?, relation(name=field_foreign_key, field=fieldId, onDelete=Cascade)
  fieldId: int

  ### The user-attempted foreign key value that the CRDT field currently carries.
  ###
  ### This may be null for nullable foreign keys. The resolver compares this
  ### value with the materialized domain value to decide whether an override row
  ### is still needed.
  attemptedValue: UuidValue?, required

  ### The foreign key value that is currently visible in the actual data row.
  ###
  ### Interpretation depends on [hasOverride]:
  ###
  ### - false: no override is active; the visible value is [attemptedValue].
  ### - true and null: the active override materializes a null FK value.
  ### - true and non-null: the active override materializes this FK value.
  visibleValue: UuidValue?

  ### Whether the foreign key projection overrides the attempted value.
  ###
  ### This is internal projection metadata, not CRDT conflict state. The FK
  ### resolver recomputes it from merged row, field, and tombstone facts.
  hasOverride: bool, default=false

  ### The reason for the foreign key override, if any. This is used mainly for
  ### debugging purposes.
  overrideReason: CrdtForeignKeyOverrideReason?

indexes:
  crdt_data_foreign_key_field_idx:
    fields: fieldId
    unique: true
