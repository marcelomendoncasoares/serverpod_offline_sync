### Preserved base tombstone facts for foreign key projection.
###
### Restrict/no-action blockers can temporarily restore a row that still has a
### user delete fact. This table preserves that base fact so projection can
### re-hide the row once the blocker is deleted or detached.
class: CrdtDataForeignKeyBaseTombstone
extends: BaseHlc
table: crdt_data_foreign_key_base_tombstone
database: all
fields:
  ### Row whose base tombstone is preserved.
  row: CrdtDataRow?, relation(name=row_foreign_key_base_tombstone, field=rowId, onDelete=Cascade)
  rowId: int

  ### The node that wrote the preserved tombstone fact.
  node: CrdtNode?, relation

  ### Preserved monotone causal-length flag.
  clFlag: int

  ### Preserved reason from the base tombstone.
  reason: CrdtDataDeletedReason

indexes:
  crdt_data_foreign_key_base_tombstone_row_idx:
    fields: rowId
    unique: true
