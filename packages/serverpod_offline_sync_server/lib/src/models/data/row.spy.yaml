### CRDT data rows table.
###
### This table stores the data for all tables that are registered for CRDT
### synchronization. It is used to interact with the CRDT data.
###
### The row is also the HLC timestamp for when it was inserted. This is used to
### avoid creating one entry per field until a field is updated.
class: CrdtDataRow
extends: BaseHlc
table: crdt_data_rows
database: all
fields:
  ### Identifier for the user or client that owns the data.
  user: CrdtUser?, relation(onDelete=Cascade)

  ### Reference to the table this row belongs to.
  tbl: CrdtSchemaTable?, relation(onDelete=Cascade)

  ### Row identifier.
  uuidRowId: UuidValue

  ### The node that inserted the row with the HLC timestamp.
  node: CrdtNode?, relation

  ### Materialized visibility state for domain queries.
  ###
  ### Updated by user tombstone writes and foreign key projection. Visible
  ### states are listed before hidden states in CrdtDataRowVisibility.
  visibility: CrdtDataRowVisibility, default=userInsert

  ### The synced user tombstone for this row.
  ###
  ### Only present after the first user visibility change event has been recorded.
  ### Projection may keep a visible [visibility] while a user delete tombstone exists.
  deleted: CrdtDataDeleted?, relation(name=row_deleted, optional)

  ### The fields for this row.
  fields: List<CrdtDataField>?, relation(name=row_fields)

indexes:
  crdt_data_rows_user_tbl_row_idx:
    fields: userId, tblId, uuidRowId
    unique: true
  ### TODO: Enable as serverOnly once Serverpod supports scoping indexes.
  ###
  ### Would cover the user-agnostic tombstone visibility scan, which filters
  ### by table and row id across all users (see whereVisibleOnCrdtRow). Only
  ### the server runs user-agnostic queries, but the index would cost every
  ### client ~21 bytes per CRDT row plus write amplification, so it is left
  ### out until it can be restricted to the server database.
