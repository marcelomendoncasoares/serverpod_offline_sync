### CRDT nodes table.
###
### This table stores all nodes that have been seen.
class: CrdtNode
table: crdt_nodes
database: all
fields:
  ### The scope that owns the node.
  scope: CrdtScope?, relation(name=scope_nodes, onDelete=Cascade)

  ### Unique identifier for the node.
  uuidNodeId: UuidValue, default=random_v7, unique

  ### The last HLC timestamp when the node has synchronized.
  lastReceivedHlc: Hlc?
