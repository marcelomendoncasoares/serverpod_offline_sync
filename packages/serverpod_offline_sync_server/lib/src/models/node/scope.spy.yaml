### CRDT scopes table.
###
### Normalized storage for scope IDs. The normalized data table references this
### by integer id instead of storing the scope id string.
class: CrdtScope
table: crdt_scopes
database: all
fields:
  ### Scope identifier string.
  uuidScopeId: UuidValue, default=random_v7, unique

  ### The current node id of the scope.
  currentNode: CrdtNode?, relation(optional)

  ### The nodes associated with the scope.
  nodes: List<CrdtNode>?, relation(name=scope_nodes)
