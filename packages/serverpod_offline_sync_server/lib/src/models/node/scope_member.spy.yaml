### Server-side authorization membership for shared CRDT scopes.
###
### Personal-scope membership is implicit: a user always belongs to the scope
### whose UUID equals their auth user UUID. Rows in this table represent shared
### scopes only.
class: CrdtScopeMember
table: crdt_scope_members
database: server
fields:
  ### Shared scope this membership grants access to.
  scope: CrdtScope?, relation(onDelete=Cascade)

  ### Auth user UUID that may access the scope.
  userUuid: UuidValue

  ### Application-defined role. Stored but not enforced by this package yet.
  role: String?

indexes:
  ### Leads with userUuid so the per-cycle membership resolution
  ### (`WHERE userUuid = ?`) is index-covered, while still enforcing one row
  ### per (scope, user). `isMember` (`WHERE userUuid AND scopeId`) is covered
  ### too.
  crdt_scope_member_unique_idx:
    fields: userUuid, scopeId
    unique: true
