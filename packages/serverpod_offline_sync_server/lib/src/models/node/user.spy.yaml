### CRDT users table.
###
### Normalized storage for user IDs. The normalized data table references this
### by integer id instead of storing the user id string.
class: CrdtUser
table: crdt_users
fields:
  ### User identifier string.
  uuidUserId: UuidValue, default=random_v7, unique

  ### The current node id of the user.
  currentNode: CrdtNode?, relation(optional)

  ### The nodes associated with the user.
  nodes: List<CrdtNode>?, relation(name=user_nodes)
