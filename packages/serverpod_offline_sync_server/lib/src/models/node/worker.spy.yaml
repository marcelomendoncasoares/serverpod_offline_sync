### CRDT workers table.
###
### This table exists only for local arbitrage between existing workers to
### coordinate an integer worker ID. This table should not be synced to other
### nodes.
###
### The ID is incremented by 1 for each new worker and should be cleaned up
### when the worker is no longer needed, so the numbers are always low.
class: CrdtWorker
table: crdt_workers
database: all
fields:
  ### The worker ID to identify different workers on the same node.
  workerId: int, unique
