### A single scope a peer announces in a [CrdtSyncScopeSet].
###
### Carries the scope UUID and the authoritative [role] the receiving user
### holds in it. The [role] is null for the personal scope and whenever roles
### are not tracked (e.g. a follower reporting its own local view).
class: CrdtScopeGrant
fields:
  ### Scope UUID being announced.
  uuidScopeId: UuidValue

  ### Authoritative role of the receiving user in this scope, when known.
  role: String?
