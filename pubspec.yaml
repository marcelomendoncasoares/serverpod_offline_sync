name: serverpod_offline_sync_workspace
publish_to: none

environment:
  sdk: '^3.10.3'

workspace:
  - benchmark
  - packages/serverpod_offline_sync
  - packages/serverpod_offline_sync_client
  - packages/serverpod_offline_sync_server
  - test/serverpod_offline_sync_test_client
  - test/serverpod_offline_sync_test_server

dev_dependencies:
  melos: ^7.5.1
  serverpod_cli: 4.0.0-beta.1

dependency_overrides:
  serverpod:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod
      ref: forward-shared-tables-on-modules
  serverpod_auth_core_client:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_client
      ref: forward-shared-tables-on-modules
  serverpod_auth_core_server:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: modules/serverpod_auth/serverpod_auth_core/serverpod_auth_core_server
      ref: forward-shared-tables-on-modules
  serverpod_cli:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: tools/serverpod_cli
      ref: forward-shared-tables-on-modules
  serverpod_client:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_client
      ref: forward-shared-tables-on-modules
  serverpod_database:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_database
      ref: forward-shared-tables-on-modules
  serverpod_embedded_postgres:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_embedded_postgres
      ref: forward-shared-tables-on-modules
  serverpod_shared:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_shared
      ref: forward-shared-tables-on-modules
  serverpod_serialization:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_serialization
      ref: forward-shared-tables-on-modules
  serverpod_service_client:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_service_client
      ref: forward-shared-tables-on-modules
  serverpod_test:
    git:
      url: https://github.com/marcelomendoncasoares/serverpod.git
      path: packages/serverpod_test
      ref: forward-shared-tables-on-modules

melos:
  packages:
    - benchmark
    - packages/*
    - tests/**

  categories:
    publish:
      - packages/*

  scripts:
    cleanup: |
        find . -type d \( -name generated -o -name protocol \) -print0 |
        xargs -0 -I@ find @ -mindepth 1 -maxdepth 1 ! -name analysis_options.yaml -print0 |
        xargs -0 rm -rf
    setup:
      run: dart pub get && melos generate && melos create-migration
    lint:
      exec: dart analyze . --fatal-infos --fatal-warnings
    fix:
      exec: dart fix --apply
    format:
      run: |
        git ls-files '*.dart' \
          | grep -v '/lib/src/generated/' \
          | grep -v '/lib/src/protocol/' \
          | grep -v '/lib/migrations/' \
          | grep -v '/serverpod_test_tools\.dart$' \
          | grep -v '\.g\.dart$' \
          | grep -v '\.drift\.dart$' \
          | xargs -r dart format --output=none --set-exit-if-changed
    generate:
      # Must run the module first, or the test project won't have the tables.
      run: |
        melos exec --scope="serverpod_offline_sync_server" -- dart run serverpod_cli generate --force &&
        melos exec --scope="serverpod_offline_sync_test_server" -- dart run serverpod_cli generate --force
    create-migration:
      # If the module does not run first, the test project will see no module tables.
      run: >-
        melos exec --scope="serverpod_offline_sync_server" -- dart run serverpod_cli create-migration --force &&
        melos exec --scope="serverpod_offline_sync_test_server" -- dart run serverpod_cli create-migration --force
    upgrade:
      exec: dart pub upgrade
    downgrade:
      exec: dart pub downgrade
    test:
      run: >-
        melos exec --scope="serverpod_offline_sync" -- dart test test/ --reporter=failures-only &&
        melos exec --scope="serverpod_offline_sync_server" -- dart test test/ --reporter=failures-only --concurrency=1 &&
        melos exec --scope="serverpod_offline_sync_test_server" -- dart test test/ --reporter=failures-only --concurrency=1
    reset:
      exec: rm -f test.db*
    publish-check:
      run: melos exec --category="publish" -- dart pub publish --dry-run
