class: Address
table: address
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### Owner scope of this row. Maintained by the CRDT sync layer.
  scopeId: int?
  street: String
  inhabitantId: UuidValue?, unique
  inhabitant: Person?, relation(name=person_address, field=inhabitantId, onDelete=Restrict)
indexes:
  address_scope_inhabitant_unique_idx:
    fields: scopeId, inhabitantId
    unique: true
