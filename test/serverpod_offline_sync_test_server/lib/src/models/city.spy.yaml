class: City
table: city
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### Owner scope of this row. Maintained by the CRDT sync layer.
  scopeId: int?, relation(parent=crdt_scopes, onDelete=Cascade)
  name: String
  citizens: List<Person>?, relation(name=city_citizens)
  organizations: List<Organization>?, relation(name=city_org)
