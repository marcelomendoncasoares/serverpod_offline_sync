class: Organization
table: organization
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### Owner scope of this row. Maintained by the CRDT sync layer.
  scopeId: int?
  name: String
  people: List<Person>?, relation(name=org_person)
  city: City?, relation(name=city_org, optional, onDelete=Cascade)
