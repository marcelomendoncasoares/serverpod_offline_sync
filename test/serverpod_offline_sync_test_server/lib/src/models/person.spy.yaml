class: Person
table: person
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### Owner scope of this row. Maintained by the CRDT sync layer.
  scopeId: int?, relation(parent=crdt_scopes, onDelete=Cascade)
  name: String
  surname: String?
  address: Address?, relation(name=person_address)
  organization: Organization?, relation(name=org_person, optional, onDelete=Cascade, deferred)
  oldCompany: Company?, relation(optional)
  city: City?, relation(name=city_citizens, optional, deferred)
