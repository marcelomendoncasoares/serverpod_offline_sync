class: Person
table: person
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### Owner scope of this row. Maintained by the CRDT sync layer.
  scopeId: int?
  name: String
  surname: String?
  address: Address?, relation(name=person_address)
  organization: Organization?, relation(name=org_person, optional, onDelete=Cascade)
  oldCompany: Company?, relation(optional)
