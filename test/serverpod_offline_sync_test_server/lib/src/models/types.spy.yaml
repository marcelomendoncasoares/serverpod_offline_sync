# Wide row shape inspired by the legacy Drift `TableWithEveryColumnType` benchmark.
class: Types
table: types
database: sync
fields:
  aBool: bool
  aDateTime: DateTime
  aText: String
  anInt: int
  anInt64: BigInt
  aReal: double
  aBlob: ByteData
  anEnum: TypesEnum?
  optionalText: String?
  optionalUuid: UuidValue?

indexes:
  types_a_text_idx:
    fields: aText
    unique: false
