# Wide row shape inspired by the legacy Drift `TableWithEveryColumnType` benchmark.
class: Types
table: types
database: all
fields:
  id: UuidValue?, defaultPersist=random_v7
  ### Owner scope of this row. Maintained by the CRDT sync layer.
  scopeId: int?
  aBool: bool
  aDateTime: DateTime
  aText: String
  anInt: int
  anInt64: BigInt
  aReal: double
  aBlob: ByteData
  anEnum: TypesEnum?
  optionalText: String?
  optionalUuid: UuidValue?

indexes:
  types_a_text_idx:
    fields: aText
    unique: false
