name: serverpod_offline_sync_test_server
description: Starting point for a Serverpod server.
publish_to: none

environment:
  sdk: '^3.12.2'

resolution: workspace

dependencies:
  serverpod: ^4.0.0
  serverpod_auth_core_server: ^4.0.0
  serverpod_offline_sync:
    path: ../../packages/serverpod_offline_sync
  serverpod_offline_sync_server:
    path: ../../packages/serverpod_offline_sync_server
  serverpod_offline_sync_test_shared:
    path: ../serverpod_offline_sync_test_shared

dev_dependencies:
  clock: ^1.1.2
  lints: '>=3.0.0 <7.0.0'
  path: ^1.9.1
  serverpod_cli: ^4.0.0
  serverpod_database: ^4.0.0
  serverpod_offline_sync_client:
    path: ../../packages/serverpod_offline_sync_client
  serverpod_offline_sync_test_client:
    path: ../serverpod_offline_sync_test_client
  serverpod_test: ^4.0.0
  # sqlite_async 0.14.5 cannot extend the base WorkerDatabase in 0.9.5.
  sqlite3_web: 0.9.4
  test: ^1.25.5
  uuid: ^4.5.3

serverpod:
  flutter_apps:
    Example:
      path: ../../example/offline_sync_demo
      auto_launch: true
      device: linux
