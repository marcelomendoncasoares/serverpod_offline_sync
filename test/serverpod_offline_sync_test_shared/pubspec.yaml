name: serverpod_offline_sync_test_shared
description: >-
  Synchronized models owned by a package outside the test server, so the suite
  covers rows whose class name the host protocol resolves with a prefix.
publish_to: none

environment:
  sdk: ^3.12.2
resolution: workspace

dependencies:
  serverpod_database: 4.0.0-rc.2
  serverpod_offline_sync:
    path: ../../packages/serverpod_offline_sync
  serverpod_serialization: 4.0.0-rc.2

dev_dependencies:
  lints: '>=3.0.0 <7.0.0'
